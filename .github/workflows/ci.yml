name: CI Pipeline

on:
  push:
  pull_request:

jobs:

  # =========================
  # JOB 1 : PYTHON
  # =========================
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup database
        run: bash db/setup.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Run tests
        run: pytest -v
        working-directory: python-app


  # =========================
  # JOB 2 : JAVASCRIPT
  # =========================
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup database
        run: bash db/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: node-app

      - name: Run tests
        run: npm test
        working-directory: node-app


  # =========================
  # JOB 3 : JAVA
  # =========================
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup database
        run: bash db/setup.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and test
        run: mvn -B package
        working-directory: java-app


  # =========================
  # JOB 4 : PHP
  # =========================
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup database
        run: bash db/setup.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Install dependencies
        run: composer install --no-interaction
        working-directory: php-app

      - name: Run tests
        run: vendor/bin/phpunit tests
        working-directory: php-app
